[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clio"
version = "0.1.0"
description = "CLI Organizer for Tasks: a terminal kanban with a CLI and a TUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
    "typer>=0.12",
    "rich>=13",
    "platformdirs>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
clio = "clio.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
